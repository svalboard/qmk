name: Release QMK Firmware

# Builds and publishes firmware only for a release tag (D41). Branch pushes and
# PRs do not build, so each release uses the runners once.
#
#   v<N>[.<M>...]  (v3, v3.1)  a full release, published as a draft: a person
#                               checks it and publishes it
#   x<N>[.<M>...]  (x3, x3.1)  a prerelease, for next.keybard.svalboard.com,
#                               published at once as a GitHub prerelease
#
# Any other tag is refused by the version job (release_version.py owns the
# rules), so nothing else publishes; the push filter below only keeps
# unrelated tags from starting a run. Both kinds must name a commit on the
# svalboard branch. The same tag name marks the firmware, Keybard and Keybard
# Host releases that go together. Old vLaunch tags keep their releases.
#
# To re-run a release by hand, run this workflow on the tag itself and name it
# again (both must agree):
#
#   gh workflow run release.yml -R svalboard/qmk --ref x3 -f tag=x3
#
# A release is two files, one per keymap: svalboard/either, one image for both
# halves (the side comes from the thumb strap or the stored side record), the
# auto build that drives whichever pointing module is attached (D34), with the
# sval keymap and with the blank keymap (no key bindings: a test image for
# checking every key after a build, D40). Each is a release updater build
# (SVAL_UPDATER=yes SVAL_UPDATE_RELEASE=yes; docs/updater.md, "Releases"),
# published as a pair UF2 (docs/pair-uf2.md): copied onto either half in
# BOOTSEL it installs that half and then the other one over the split cable,
# and Keybard installs from the same file. Per-side and per-module builds
# still build but are not released, and SVAL_TEST_WIPE never is:
#
#   version  the tag and keyboards/svalboard/updater/fw_version.txt (D32):
#            the tag must be a release tag (above), and the number must go
#            up past every published release, x tags included
#   build    2 release updater builds (pinned image and toolchain); each
#            checks its RAM commit code and uploads its pair UF2
#            (make_update.py pair --release, then verify-pair) and its ELF.
#            No build job can write to the repository
#   lint     the tag still names this run's commit; each pair UF2 has the
#            pair layout and holds its ELF's flash contents, with a manifest
#            and build-info record that match the build; the release ELFs
#            have no test hooks, keytest or host bootloader; the builds agree
#            on the split message table with each other and with the
#            committed golden table, so they also talk to the per-side
#            releases already on boards (P1)
#   publish  the release named after the tag, with the 2 pair UF2 files and
#            two lines on what to do with them: a draft for a v tag, a
#            prerelease for an x tag
#
# Every job checks out the run's commit (github.sha), never the tag by name.
on:
  push:
    tags:
      - 'v[0-9]*'
      - 'x[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to build again (v3, x3); run the workflow on that tag'
        required: true
        type: string

# One run per tag at a time: a push and a re-run cannot publish twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # Forks never publish firmware: every other job needs this one.
    if: github.repository == 'svalboard/qmk'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      fw_version: ${{ steps.check.outputs.fw_version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      draft: ${{ steps.check.outputs.draft }}
    steps:
    - name: A re-run names the tag it runs on
      if: github.event_name == 'workflow_dispatch'
      env:
        TAG: ${{ inputs.tag }}
      run: |
        if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
          echo "::error::run this on the tag: gh workflow run release.yml --ref $TAG -f tag=$TAG (this run is on $GITHUB_REF)"
          exit 1
        fi

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # the previous release's tag
        persist-credentials: false

    - name: Check the commit is on the svalboard branch
      run: |
        git merge-base --is-ancestor "$GITHUB_SHA" origin/svalboard || {
          echo "::error::$GITHUB_REF_NAME names $GITHUB_SHA, which is not on the svalboard branch"
          exit 1
        }

    - name: Check the version (D32)
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 -I keyboards/svalboard/tools/release_version.py "$GITHUB_REF_NAME" \
          --repo "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"

  build:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-firmware.yml
    with:
      keyboard: ${{ matrix.keyboard }}
      keymap: ${{ matrix.keymap }}
      side: ${{ matrix.side }}
      updater: true
      version_string: ${{ needs.version.outputs.version }}
      fw_version: ${{ needs.version.outputs.fw_version }}

    strategy:
      matrix:
        keyboard: [ svalboard ]
        keymap: [ sval, blank ]
        side: [ either ]

  lint:
    needs: [ version, build ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: The tag still names this run's commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash keyboards/svalboard/tools/check_tag_commit.sh

    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release
        merge-multiple: true

    - name: Each pair UF2 holds its ELF's image; manifests match the builds
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        ls -l release
        python3 -I keyboards/svalboard/tools/check_release_artifacts.py release --version "$VERSION"

    - name: Lint the release updater ELFs
      run: |
        test "$(find release -name "*.elf" | wc -l)" -eq 2
        python3 -I keyboards/svalboard/tools/check_release_elf.py release/*.elf

    - name: Split message table of the builds, and the golden table (P1)
      run: |
        python3 -I keyboards/svalboard/tools/check_split_tables.py --dir release \
          --golden keyboards/svalboard/tools/split_table_golden.json

  publish:
    needs: [ version, lint ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release
        merge-multiple: true

    - name: Release with the pair UF2 files
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        PRE: ${{ needs.version.outputs.prerelease }}
        DRAFT: ${{ needs.version.outputs.draft }}
      run: |
        R="$GITHUB_REPOSITORY"
        test "$(find release -name "*.uf2" | wc -l)" -eq 2
        test "$(find release -name "*.svup" | wc -l)" -eq 0
        # The release body: two plain lines on what to do with the files.
        L1="To install by hand, copy svalboard_sval_$TAG.uf2 onto the RPI-RP2 drive of either half: that half installs it, then updates the other half over the split cable."
        L2="Or open the same file in Keybard and install it from there."
        NOTES="$(printf '%s\n\n%s' "$L1" "$L2")"
        args=(--verify-tag --title "$TAG" --notes "$NOTES")
        if [ "$PRE" = true ]; then args+=(--prerelease); fi
        if [ "$DRAFT" = true ]; then args+=(--draft); fi
        if [ "$PRE" = "$DRAFT" ]; then
          echo "::error::$TAG must be either a prerelease or a draft"
          exit 1
        fi
        if gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
          echo "::error::$TAG already has a release: delete it, then re-run all jobs"
          exit 1
        fi
        gh release create "$TAG" -R "$R" "${args[@]}" release/*.uf2
        gh release view "$TAG" -R "$R" --json isDraft,isPrerelease,assets -q '{isDraft, isPrerelease, assets: (.assets | length)}'
