name: Svalboard updater host tests

# Host tests for the in-firmware updater (util/updater_test/run.sh: the state
# machine, commit, relay, split link, raw HID framing and tools under ASan and
# UBSan; no QMK build; only the ChibiOS submodule, for the raw HID framing test), the settings storage tests
# (tests/sval_storage) and the wear-leveling gtests the storage relies on. release.yml runs it before building a release (workflow_call); it can also be
# run by hand (workflow_dispatch). Run it locally first with util/updater_test/run.sh.

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: ChibiOS (raw HID framing test)
      run: git submodule update --init --depth 1 lib/chibios

    - name: Host tests (ASan, UBSan)
      run: bash util/updater_test/run.sh

    - name: Storage tests
      run: python3 -m unittest discover -s tests/sval_storage -v

  wear-leveling:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false

    - name: Wear-leveling gtests
      run: make test:wear_leveling_mirror test:wear_leveling_mirror_large test:wear_leveling_general
