name: Svalboard updater host tests

# Host tests for the in-firmware updater (util/updater_test/run.sh: the state
# machine, commit, relay, split link, raw HID framing and tools under ASan and
# UBSan; no QMK build; only the ChibiOS submodule, for the raw HID framing test), the settings storage tests
# (tests/sval_storage) and the wear-leveling gtests the storage relies on. Runs only when updater files change; tag pushes do
# not run it (release.yml lints release builds itself).

permissions:
  contents: read

on:
  push:
    branches:
    - '**'
    paths:
    - 'keyboards/svalboard/updater/**'
    - 'keyboards/svalboard/split_pause.c'
    - 'keyboards/svalboard/split_pause.h'
    - 'keyboards/svalboard/side.c'
    - 'keyboards/svalboard/side.h'
    - 'keyboards/svalboard/tools/m3/**'
    - 'keyboards/svalboard/config.h'
    - 'keyboards/svalboard/tools/make_update.py'
    - 'keyboards/svalboard/tools/sval_update.py'
    - 'keyboards/svalboard/tools/release_version.py'
    - 'keyboards/svalboard/tools/check_release_artifacts.py'
    - 'keyboards/svalboard/tools/check_release_elf.py'
    - 'keyboards/svalboard/tools/check_split_tables.py'
    - 'keyboards/svalboard/tools/split_table_golden.json'
    - 'keyboards/svalboard/tools/check_tag_commit.sh'
    - 'tests/sval_updater/**'
    - 'tests/sval_rawhid/**'
    - 'tests/sval_storage/**'
    - 'tests/test_common/**'
    - 'modules/svalboard/core/**'
    - 'quantum/wear_leveling/**'
    - 'drivers/wear_leveling/**'
    - 'platforms/chibios/drivers/wear_leveling/**'
    - 'tmk_core/protocol/chibios/usb_packet.h'
    - 'util/updater_test/**'
    - '.github/workflows/updater-tests.yml'
    - '.github/workflows/release.yml'
    - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
    - 'keyboards/svalboard/updater/**'
    - 'keyboards/svalboard/split_pause.c'
    - 'keyboards/svalboard/split_pause.h'
    - 'keyboards/svalboard/side.c'
    - 'keyboards/svalboard/side.h'
    - 'keyboards/svalboard/tools/m3/**'
    - 'keyboards/svalboard/config.h'
    - 'keyboards/svalboard/tools/make_update.py'
    - 'keyboards/svalboard/tools/sval_update.py'
    - 'keyboards/svalboard/tools/release_version.py'
    - 'keyboards/svalboard/tools/check_release_artifacts.py'
    - 'keyboards/svalboard/tools/check_release_elf.py'
    - 'keyboards/svalboard/tools/check_split_tables.py'
    - 'keyboards/svalboard/tools/split_table_golden.json'
    - 'keyboards/svalboard/tools/check_tag_commit.sh'
    - 'tests/sval_updater/**'
    - 'tests/sval_rawhid/**'
    - 'tests/sval_storage/**'
    - 'tests/test_common/**'
    - 'modules/svalboard/core/**'
    - 'quantum/wear_leveling/**'
    - 'drivers/wear_leveling/**'
    - 'platforms/chibios/drivers/wear_leveling/**'
    - 'tmk_core/protocol/chibios/usb_packet.h'
    - 'util/updater_test/**'
    - '.github/workflows/updater-tests.yml'
    - '.github/workflows/release.yml'
    - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: ChibiOS (raw HID framing test)
      run: git submodule update --init --depth 1 lib/chibios

    - name: Host tests (ASan, UBSan)
      run: bash util/updater_test/run.sh

    - name: Storage tests
      run: python3 -m unittest discover -s tests/sval_storage -v

  wear-leveling:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false

    - name: Wear-leveling gtests
      run: make test:wear_leveling_mirror test:wear_leveling_mirror_large test:wear_leveling_general
